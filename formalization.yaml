# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Gallai–van der Waerden numbers from quadratic-residue colourings"
  description: >-
    A Lean 4 and Mathlib proof of a lower-bound construction for the Gallai–van der Waerden numbers
    GW(r; 3, l) of Mao, Ozeki, Robertson and Wang: the least m such that for every n ≥ m, every
    exact r-colouring of {1, …, n} contains a rainbow 3-term or a monochromatic l-term arithmetic
    progression. Theorem 1: let l ≥ 4 and let p > l be a prime with p ≡ 1 (mod 8) such that no l
    consecutive integers in [1, p − 1] have the same Legendre symbol modulo p; let s ≥ 2 and let z
    colour {0, …, l − 1} onto s colours with no rainbow 3-term progression. Colour x in
    [1, (l − 1)p + 1] by its quadratic character of x − 1 (two colours) when x ≢ 1 (mod p), and the
    point x = 1 + kp by the new colour 2 + z(k). This colouring uses all s + 2 colours and has no
    rainbow 3-term and no monochromatic l-term progression, so GW(s + 2; 3, l) > (l − 1)p + 1. The
    formalization proves Theorem 1 for every such l, p, s and z, the resulting bound for GW
    (unconditionally for every threshold with the defining property, and for the number itself given
    that a threshold exists), and the instance (l, p) = (4, 17), which gives GW(4; 3, 4) > 52 and
    GW(5; 3, 4) > 52.
  authors:
    - "Arhan Canli"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arhan Canli"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["05D10", "11B25", "11A15"]

sources:
  - title: >-
      Quadratic-residue colourings with a rainbow-free colouring of the zero class give
      GW(s + 2; 3, l) > (l − 1)p + 1 (Theorem 1 of Quantavane's note on Gallai–van der Waerden
      numbers, 11 November 2026)
    type: original-proof
    relationship: other
    contributors:
      - name: "Claude (Anthropic)"
        role: >-
          AI agents working under Arhan Canli's direction: found the construction, wrote the informal
          proof and the Lean proof, and rebuilt and checked the Lean proof
    note: >-
      First presented in this repository; an unpublished internal note of Quantavane has the same
      statement and informal proof. A literature search on 11 November 2026 (MORW 2023, Si 2026,
      MathWorld's Gallai–van der Waerden page and two web searches) found no earlier construction of
      this kind and no published value or bound of GW(r; 3, l) for l ≥ 4. The search was limited, so
      novelty is not established beyond it.
  - title: "Arithmetic progressions, quasi progressions, and Gallai-Ramsey colorings"
    authors:
      - "Yaping Mao"
      - "Kenta Ozeki"
      - "Aaron Robertson"
      - "Zhao Wang"
    id: "doi:10.1016/j.jcta.2022.105672"
    type: paper
    location: "J. Combin. Theory Ser. A 193 (2023), 105672; Definition 1.15 (Gallai–van der Waerden numbers)"
    relationship: background
    note: >-
      Introduces the Gallai–van der Waerden numbers GW(r; k, l). The definitions IsGoodExactColouring,
      GWProperty and GW in Challenge.lean follow Definition 1.15 with k = 3. The paper gives values and
      bounds for l = 3 and asymptotic bounds, but no value for l ≥ 4.
    author_endorsement: not-contacted
  - title: "Some progression-free partitions constructed using Folkman's method"
    authors:
      - "John R. Rabung"
    id: "doi:10.4153/CMB-1979-012-1"
    type: paper
    location: "Canad. Math. Bull. 22 (1979), 87–91"
    relationship: background
    note: >-
      Power-residue colourings as lower-bound constructions for van der Waerden numbers. The residue
      part of gwColour (the quadratic character of x − 1) is this classical idea; the zero-class
      colouring and the Gallai (rainbow) setting are what Theorem 1 adds.
    author_endorsement: not-contacted
  - title: "Improving the Use of Cyclic Zippers in Finding Lower Bounds for van der Waerden Numbers"
    authors:
      - "John Rabung"
      - "Mark Lotts"
    id: "doi:10.37236/2363"
    type: paper
    location: "Electron. J. Combin. 19(2) (2012), #P35"
    relationship: background
    note: "Later development of residue-based lower bounds for van der Waerden numbers."
    author_endorsement: not-contacted
  - title: "Complete Determination of the Gallai-van der Waerden Number GW(r;3,3)"
    authors:
      - "Yuan Si"
    id: "arXiv:2610.30711"
    type: paper
    location: "https://arxiv.org/abs/2610.30711 (October 2026)"
    relationship: background
    note: >-
      Determines GW(r; 3, 3) for every r; this formalization concerns l ≥ 4. Y. Si has not reviewed
      this repository.
    author_endorsement: other

related_formalizations: []

status:
  scope: >-
    Formalized: Theorem 1 (parts (a) exactness, (b) no rainbow 3-term progression, (c) no
    monochromatic l-term progression on [1, (l − 1)p + 1]) for every l ≥ 4, every prime p > l with
    p ≡ 1 (mod 8) and no run of l equal Legendre symbols in [1, p − 1], every s ≥ 2 and every onto,
    rainbow-free z : Fin l → Fin s; the existence of a good exact (s + 2)-colouring; the bound
    (l − 1)p + 1 < m for every m with the defining property of GW(s + 2; 3, l); the bound for
    GW (s + 2) l itself under the hypothesis that some threshold exists; and the instance
    (l, p) = (4, 17) with s = 2 and s = 3. Not formalized: the Gallai–van der Waerden theorem (that a
    threshold exists), which lt_GW takes as the hypothesis hex; which primes satisfy the run
    hypothesis in general (the internal note uses Weil's bound and a computer search for that);
    exact values of any GW number; optimality of the bound.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        AI agents in Claude Code with shell access to a local Lean toolchain and Mathlib, working under
        Arhan Canli's direction: a coordinating agent found the construction and wrote the informal
        proof; a Lean agent wrote the Lean proof (Lean v4.33.1); the coordinating agent rebuilt it
        and checked the statement and axioms; a further agent ported it to Lean v4.35.0, the module
        system and this Challenge/Solution layout.
      cost:
        wall_time: "about one day (11–12 November 2026), the Lean proof itself about one hour"
        spend_usd: "subscription-based usage, not tracked per project"
        hardware: "a local Mac (Apple silicon)"
      prompting_notes: >-
        The agents were asked for new mathematics on Gallai–van der Waerden numbers, then for a Lean
        proof of the resulting theorem with only the standard axioms, then for a Palomar-ready
        package of it.
  spend_usd: "subscription-based usage, not tracked per project"
  notes: >-
    The mathematics, the informal proof and every line of Lean in this repository were written by AI
    agents (Claude, by Anthropic). Arhan Canli directed the work and is responsible for the result.

fidelity:
  divergences: >-
    None known with respect to MORW Definition 1.15 for k = 3. Lean conventions to note: colourings
    are functions ℕ → Fin r whose values outside [1, n] are ignored; GW uses sInf, which is 0 for
    the empty set, so lt_GW assumes that some threshold exists, while lt_of_gwProperty, gw_r4_l4 and
    gw_r5_l4 do not; in gwColour, points 1 + kp with k ≥ l lie outside [1, (l − 1)p + 1] and get a
    residue colour, which plays no role.

review:
  status: "agent-reviewed"
  reviewers:
    - "Quantavane's coordinating agent (Claude, Anthropic)"
  notes: >-
    The coordinating agent rebuilt the original Lean development from scratch, printed the elaborated
    statement of theorem1 with #check and compared it with the informal statement, and printed its
    axioms (propext, Classical.choice, Quot.sound). For this repository (Lean v4.35.0) the porting
    agent rebuilt everything from scratch, printed the axioms of every compared theorem, checked that
    the declarations the six compared statements depend on (including the four definitions) are
    identical in the Challenge and Solution environments, and replayed the exported Solution through
    Lean's kernel, NanoDa, lean4lean, con-leche and con-ron. No mathematician outside Quantavane has
    reviewed the proof.

alignment:
  namespace: "GwResidue"
  statements:
    - source: "Theorem 1, parts (a), (b), (c)"
      lean: "GwResidue.theorem1"
      module: "Challenge"
      status: proved
      note: "The hypotheses are hl, hp8, hlp, hrun, hs, hz, hz3 as described in Challenge.lean."
    - source: "Corollary: a good exact (s + 2)-colouring of [1, (l − 1)p + 1] exists"
      lean: "GwResidue.exists_goodExactColouring"
      module: "Challenge"
      status: proved
      note: "Witnessed by gwColour p l s z."
    - source: "Corollary: GW(s + 2; 3, l) > (l − 1)p + 1, threshold form"
      lean: "GwResidue.lt_of_gwProperty"
      module: "Challenge"
      status: proved
      note: "Every m with GWProperty (s + 2) l m exceeds (l − 1)p + 1; no existence assumption."
    - source: "Corollary: GW(s + 2; 3, l) > (l − 1)p + 1 for the number GW"
      lean: "GwResidue.lt_GW"
      module: "Challenge"
      status: proved
      note: "Assumes that some m has the GW property (the Gallai–van der Waerden theorem, not formalized here)."
    - source: "Instance (l, p) = (4, 17), s = 2: GW(4; 3, 4) > 52"
      lean: "GwResidue.gw_r4_l4"
      module: "Challenge"
      status: proved
      note: "Threshold form; shows the hypotheses of Theorem 1 can be met."
    - source: "Instance (l, p) = (4, 17), s = 3: GW(5; 3, 4) > 52"
      lean: "GwResidue.gw_r5_l4"
      module: "Challenge"
      status: proved
      note: "Threshold form."

acknowledgements: >-
  Mathlib and the Lean toolchain (Lean FRO), including the Comparator and the bundled kernel

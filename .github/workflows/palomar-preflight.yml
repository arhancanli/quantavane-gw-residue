# Palomar's own mechanical check, run on GitHub-hosted runners for every push to main.
# It builds the project from scratch in Palomar's sandbox, compiles Challenge.lean against Mathlib
# alone, runs Lean's `lake comparator` with the configuration in comparator.json, and replays the
# Solution through Lean's kernel and NanoDa (and, as an advisory check, con-ron).
# See https://submit.palomar-registry.org/llms.txt ("Mechanical preflight").
# A passing preflight is advisory; Palomar runs the same workflow again when the commit is submitted.
name: Palomar preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: gwresidue001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
